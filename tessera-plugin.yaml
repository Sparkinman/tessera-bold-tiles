# Bold tiles: an entity's value, state or switch in large bold Roboto, the name small above it, for a screen read from
# across the room. The value takes the largest size that fits the tile, up to the size the tile is set to.
id: bold_tiles
version: 0.2.0
api: "0.14"
icon: thermometer
maintainer: Paul McNeil
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 500

permissions:
  # The switch tile turns its entity on and off through wish(), which sends Home Assistant's own actions.
  home_assistant_actions: [homeassistant.turn_on, homeassistant.turn_off, light.turn_on, light.turn_off,
                           switch.turn_on, switch.turn_off, input_boolean.turn_on, input_boolean.turn_off,
                           fan.turn_on, fan.turn_off]

tiles:
  # A sensor's number large and bold, its unit beside it, the name small above.
  - id: value
    name: value_name
    icon: thermometer
    sizes: { min: 1x1, max: 6x6 }
    memory: 1200
    example: value_example
    domains: [sensor, number, input_number]
    attributes: [unit_of_measurement]
    options:
      - { id: label, kind: text, label: label, hint: label_hint }
      - { id: size, kind: choice, label: size, hint: size_hint, default: large, choices: [{ value: normal, label: size_normal }, { value: large, label: size_large }, { value: huge, label: size_huge }] }
      - { id: decimals, kind: choice, label: decimals, hint: decimals_hint, default: auto, choices: [{ value: auto, label: decimals_auto }, { value: "0", label: decimals_0 }, { value: "1", label: decimals_1 }, { value: "2", label: decimals_2 }] }
      - { id: unit, kind: toggle, label: unit, hint: unit_hint, default: true }
  # An entity's state as a large bold word: Open or Closed, Locked or Unlocked, On or Off.
  - id: state
    name: state_name
    icon: door
    sizes: { min: 1x1, max: 6x6 }
    memory: 1200
    example: state_example
    domains: [binary_sensor, lock, cover, sensor, input_boolean, switch, light, alarm_control_panel]
    attributes: [device_class]
    options:
      - { id: label, kind: text, label: label, hint: label_hint }
      - { id: size, kind: choice, label: size, hint: size_hint, default: large, choices: [{ value: normal, label: size_normal }, { value: large, label: size_large }, { value: huge, label: size_huge }] }
      - { id: alert, kind: toggle, label: alert, hint: alert_hint, default: true }
  # A light or switch: its name large and bold, On or Off under it; a tap turns it on or off.
  - id: switch
    name: switch_name
    icon: lightbulb
    sizes: { min: 1x1, max: 6x6 }
    memory: 1200
    example: switch_example
    domains: [light, switch, input_boolean, fan]
    options:
      - { id: label, kind: text, label: label, hint: label_hint }
      - { id: size, kind: choice, label: size, hint: size_hint, default: large, choices: [{ value: normal, label: size_normal }, { value: large, label: size_large }, { value: huge, label: size_huge }] }
      - { id: color, kind: choice, label: color, hint: color_hint, default: yellow, choices: [{ value: yellow, label: color_yellow }, { value: blue, label: color_blue }, { value: green, label: color_green }, { value: none, label: color_none }] }
