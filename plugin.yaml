# What a screen gets when it takes this plugin: the component, and bold Roboto (the screen's own typeface) in five
# sizes above the screen's own fonts, with the letters, digits and signs of English. Tessera includes this file from
# the screen's <name>.plugins.yaml and adds this plugin's components/ folder as an ESPHome external component.
font:
  - { id: bold_tiles_32, file: "${FONT_DIR}/Roboto-700.ttf", size: 32, bpp: 4, glyphs: &glyphs " !%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz°µ" }
  - { id: bold_tiles_44, file: "${FONT_DIR}/Roboto-700.ttf", size: 44, bpp: 4, glyphs: *glyphs }
  - { id: bold_tiles_60, file: "${FONT_DIR}/Roboto-700.ttf", size: 60, bpp: 4, glyphs: *glyphs }
  - { id: bold_tiles_80, file: "${FONT_DIR}/Roboto-700.ttf", size: 80, bpp: 4, glyphs: *glyphs }
  - { id: bold_tiles_108, file: "${FONT_DIR}/Roboto-700.ttf", size: 108, bpp: 4, glyphs: *glyphs }

bold_tiles:
  fonts: [bold_tiles_32, bold_tiles_44, bold_tiles_60, bold_tiles_80, bold_tiles_108]
